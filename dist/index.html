<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087cce"><meta name="description" content="自分の英単語で遊ぶ、7つのミニゲーム。戦車、宝探し、爆弾リレー、ボム迷路、仕分け工場、釣り、カートから選ぼう。">
<title>ことばパーティ｜ゲームをえらぼう！</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='18' fill='%23ffcf36'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='43'%3E★%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="hub.css"><script type="module" src="hub.js"></script><script type="module" src="book-picker.js"></script>
<script type="module" src="prize-ui.js"></script></head>
<body>
<main class="party-shell">
<header class="party-header"><span class="brand-mark" aria-hidden="true">★</span><div><p class="overline">WORD PLAY ISLAND</p><h1><span>ことば</span>パーティ<span class="title-star" aria-hidden="true">!</span></h1></div><span class="solo">ひとりで<br>あそぶ</span></header>
<button id="editWords" class="word-ticket" aria-controls="wordEditor"><span class="ticket-icon" aria-hidden="true">Aa</span><span><strong id="wordCount">単語セット</strong><span id="wordPreview">自分の単語で、ぜんぶ遊べる</span></span><span class="ticket-action">変更<span aria-hidden="true"> ›</span></span></button>
<button id="chooseBook" class="book-shortcut">📚 単語帳からえらぶ</button><div class="section-heading"><h2>ゲームをえらぼう！</h2><span>7 GAMES</span></div>
<section class="games" aria-label="ミニゲーム選択">
<button class="game-card tank" data-game="tank" aria-label="語彙の砦、戦車で遊ぶ"><span class="game-art" style="--col:0;--row:0" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024" fetchpriority="high"></span><span class="game-copy"><span class="genre">アクション</span><strong class="game-title">語彙の砦</strong><span class="game-description">単語で強化、敵を撃破！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card treasure" data-game="memory" aria-label="おぼえて宝箱で遊ぶ"><span class="game-art" style="--col:1;--row:0" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024"></span><span class="game-copy"><span class="genre">記憶・ペア探し</span><strong class="game-title">おぼえて宝箱</strong><span class="game-description">英語と訳のペアを発見！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card relay" data-game="bomb" aria-label="ドキドキ爆弾リレーで遊ぶ"><span class="game-art" style="--col:2;--row:0" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024"></span><span class="game-copy"><span class="genre">○×判断・CPU対戦</span><strong class="game-title">爆弾リレー</strong><span class="game-description">正解して、爆弾をパス！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card maze" data-game="maze" aria-label="単語ボム迷路で遊ぶ"><span class="game-art" style="--col:0;--row:1" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024" loading="lazy"></span><span class="game-copy"><span class="genre">迷路・サバイバル</span><strong class="game-title">単語ボム迷路</strong><span class="game-description">置いて、逃げて、道を開け！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card factory" data-game="factory" aria-label="ことば仕分け工場で遊ぶ"><span class="game-art" style="--col:1;--row:1" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024" loading="lazy"></span><span class="game-copy"><span class="genre">仕分け・スピード</span><strong class="game-title">ことば仕分け工場</strong><span class="game-description">意味に合う宛先へ届けよう！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card fishing" data-game="fishing" aria-label="ことばフィッシングで遊ぶ"><span class="game-art" style="--col:2;--row:1" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024" loading="lazy"><span class="fishing-icon" aria-hidden="true"></span></span><span class="game-copy"><span class="genre">NEW！ 釣り・駆け引き</span><strong class="game-title">ことばフィッシング DX</strong><span class="game-description">必殺技で巨大魚に挑め！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button>
<button class="game-card kart" data-game="kart" aria-label="ことばカート GPで遊ぶ"><span class="game-art kart-art" aria-hidden="true"><span class="kart-driver"></span></span><span class="game-copy"><span class="genre">NEW！ レース・単語</span><strong class="game-title">ことばカート GP</strong><span class="game-description">正解ターボで逆転優勝！</span><span class="play-label">あそぶ <span aria-hidden="true">▶</span></span></span></button><button class="game-card surprise" data-game="random" aria-label="おまかせでゲームを選ぶ"><span class="game-art" style="--col:2;--row:1" aria-hidden="true"><img src="assets/party-menu.webp" alt="" width="1536" height="1024" loading="lazy"></span><span class="game-copy"><span class="genre">迷ったら、これ！</span><strong class="game-title">おまかせスタート</strong><span class="game-description">7つのゲームから選ぶよ</span><span class="play-label">えらんで！ <span aria-hidden="true">▶</span></span></span></button></section>
<p class="home-hint">どのゲームも、セットした同じ単語で遊べます。</p>
<section id="prizeShop" class="prize-shop" aria-label="スター報酬"></section><details id="bookPicker" class="word-editor book-picker" open><summary>単語帳・番号で選ぶ</summary><p>単語帳と番号を選んで、7つのゲームで遊ぼう。</p><p id="bookSource"></p><button id="loadBooks" class="save-button">単語帳を読み込む</button><label for="bookFile">別の単語帳JSONを開く（任意）</label><input id="bookFile" type="file" accept=".json,application/json"><div id="bookFields" hidden><label for="bookSelect">単語帳</label><select id="bookSelect"></select><div class="book-range"><label>開始番号<input id="bookFrom" type="number" min="1" step="1" inputmode="numeric"></label><label>終了番号<input id="bookTo" type="number" min="1" step="1" inputmode="numeric"></label></div><p id="bookPreview" class="book-preview"></p><button id="applyBook" class="save-button" disabled>この範囲であそぶ</button></div><p id="bookStatus" role="status"></p><p class="storage-note">取り込みはこの端末内だけ。元の単語帳を書き換えたり、ファイルを送信したりしません。</p></details><details id="wordEditor" class="word-editor"><summary>単語セットを編集する</summary><label for="words">英単語と日本語訳を、1行に1組</label><textarea id="words" spellcheck="false" autocapitalize="off" aria-describedby="formatHelp error" placeholder="reduce,減らす"></textarea><p id="formatHelp">4組以上。カンマ・タブ・コロンで区切ります。宝箱・迷路・工場・釣り・カートには、異なる訳が4つ以上必要です。</p><div class="editor-actions"><button id="saveWords" class="save-button">この単語を保存</button><button id="sample" class="sample-button">サンプルを入れる</button></div><p id="error" class="error" role="alert"></p><p id="saved" class="saved" role="status"></p><p class="storage-note">単語はこのブラウザに保存されます。</p></details>
</main>
</body></html>
