<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111727"><title>ことばパーティ｜自分の単語で遊ぶ</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='16' width='48' height='38' rx='10' fill='%23dbb469'/%3E%3Cpath d='M8 35h48M32 28v15' stroke='%23293650' stroke-width='6'/%3E%3C/svg%3E"><link rel="stylesheet" href="party.css"><script type="module" src="hub.js"></script></head><body><main class="shell"><header><p class="eyebrow">WORD PLAY ARCADE</p><span id="wordCount" class="badge">単語セット</span></header><h1>ことばパーティ</h1><p>同じ単語で、今日はどっちを遊ぶ？</p><section class="games" aria-label="ゲームを選ぶ"><article class="game-card"><span class="game-icon" aria-hidden="true">💎</span><span class="new">NEW · 記憶 × 単語</span><h2>おぼえて宝箱</h2><p>箱の場所を覚えて、英単語と訳をつなごう。3部屋の宝石を集めよう。</p><button data-game="memory" class="primary">宝箱で遊ぶ</button></article><article class="game-card tank"><span class="game-icon" aria-hidden="true">🏰</span><span class="new">アクション × 単語</span><h2>語彙の砦</h2><p>単語で戦車を強化。橋と城を突破して、魔王を倒そう。</p><button data-game="tank" class="primary">戦車で遊ぶ</button></article></section><details id="wordEditor"><summary>使う単語を確認・変更する</summary><label for="words">英単語と日本語訳を1行に1組</label><textarea id="words" spellcheck="false" autocapitalize="off" placeholder="reduce,減らす"></textarea><p class="note">4組以上。カンマ／タブ／コロンで区切って入力。どちらのゲームにも同じ単語を使います。</p><button id="sample" class="secondary">サンプル単語に戻す</button></details><p id="error" class="error" role="alert"></p><p class="note">遊ぶボタンを押すと、このブラウザに単語を保存します。</p></main></body></html>
